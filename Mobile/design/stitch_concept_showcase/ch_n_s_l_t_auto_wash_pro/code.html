        body { font-family: 'Manrope', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);

<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-40">
<div class="flex justify-between items-center px-container-padding h-16 w-full">
<button class="text-primary hover:bg-surface-container transition-colors p-2 rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Auto Wash Pro</h1>
<button class="text-primary hover:bg-surface-container transition-colors p-2 rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<main class="px-container-padding py-6 max-w-2xl mx-auto">
<!-- Screen Title -->
<div class="text-center mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Mua gói slot</h2>
</div>
<!-- Stepper -->
<div class="flex items-center justify-center mb-10 w-full max-w-sm mx-auto">
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm">check</span>
</div>
<div class="w-8 h-[2px] bg-primary"></div>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm">check</span>
</div>
<div class="w-8 h-[2px] bg-primary"></div>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold">
                    3
                </div>
<div class="w-8 h-[2px] bg-surface-variant"></div>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-secondary font-bold">
                    4
                </div>
</div>
</div>
<!-- Content Area -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.05)] mb-section-margin">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-6">Chọn số lần rửa xe</h3>
<!-- Discount Tiers Grid -->
<div class="grid grid-cols-2 gap-card-gap mb-8">
<!-- Tier 1 -->
<div class="bg-surface-container-low rounded-lg p-4 text-center border border-transparent transition-colors hover:bg-surface-container">
<div class="font-label-md text-label-md text-secondary mb-1">1-4 lần</div>
<div class="font-headline-sm text-headline-sm text-on-surface mb-1">Giá gốc</div>
<div class="font-caption text-caption text-secondary">Giá gốc</div>
</div>
<!-- Tier 2 (Active representation) -->
<div class="bg-[#f0fcf5] rounded-lg p-4 text-center border border-primary transition-colors cursor-pointer">
<div class="font-label-md text-label-md text-secondary mb-1">5-9 lần</div>
<div class="font-headline-sm text-headline-sm text-primary mb-1">-5%</div>
<div class="font-caption text-caption text-secondary">Tiết kiệm 5%</div>
</div>
<!-- Tier 3 -->
<div class="bg-surface-container-low rounded-lg p-4 text-center border border-transparent transition-colors hover:bg-surface-container cursor-pointer">
<div class="font-label-md text-label-md text-secondary mb-1">10-19 lần</div>
<div class="font-headline-sm text-headline-sm text-primary mb-1">-10%</div>
<div class="font-caption text-caption text-secondary">Tiết kiệm 10%</div>
</div>
<!-- Tier 4 -->
<div class="bg-surface-container-low rounded-lg p-4 text-center border border-transparent transition-colors hover:bg-surface-container cursor-pointer">
<div class="font-label-md text-label-md text-secondary mb-1">20+ lần</div>
<div class="font-headline-sm text-headline-sm text-primary mb-1">-15%</div>
<div class="font-caption text-caption text-secondary">Tiết kiệm 15%</div>
</div>
</div>
<!-- Counter Section -->
<div class="flex flex-col items-center justify-center mb-8">
<div class="flex items-center gap-6 mb-2">
<button class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors active:scale-95">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="flex flex-col items-center justify-center min-w-[60px]">
<span class="font-display-lg text-display-lg text-on-surface">5</span>
<span class="font-caption text-caption text-secondary mt-[-4px]">lần</span>
</div>
<button class="w-12 h-12 rounded-full bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface transition-colors active:scale-95">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Quick Select Chips -->
<div class="flex flex-wrap justify-center gap-3">
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">1x</button>
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">3x</button>
<button class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md shadow-sm">5x</button>
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">10x</button>
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">15x</button>
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors">20x</button>
</div>
</section>
<!-- Action Buttons -->
<div class="flex justify-between items-center mt-section-margin pt-6 border-t border-surface-variant">
<button class="px-6 py-3 rounded-lg border-2 border-primary text-primary font-label-md text-label-md bg-surface-container-lowest hover:bg-surface transition-colors active:scale-95">
                Quay lại
            </button>
<button class="px-8 py-3 rounded-lg bg-primary text-on-primary font-label-md text-label-md shadow-md hover:bg-surface-tint transition-colors active:scale-95">
                Tiếp theo
            </button>
</div>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl md:hidden">

<span class="font-label-md text-label-md text-[10px]">Bookings</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:text-primary active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined mb-1">qr_code_scanner</span>
<span class="font-label-md text-label-md text-[10px]">Check-in</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary px-4 py-1 hover:text-primary active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md text-[10px]">Account</span>
</button>
