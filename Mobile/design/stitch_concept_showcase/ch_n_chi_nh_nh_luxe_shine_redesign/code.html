<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[type="radio"][name="branch"]');
            
            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all borders and inner dots
                    document.querySelectorAll('.border-primary.border-2:not(.rounded-full)').forEach(el => {
                        el.classList.remove('border-primary');
                        el.classList.add('border-transparent');
                    });
                    
                    const radioIndicators = document.querySelectorAll('.rounded-full.border-primary');
                    radioIndicators.forEach(el => {
                        el.classList.remove('border-primary');
                        el.classList.add('border-outline-variant');
                        el.querySelector('div').classList.remove('bg-primary');
                        el.querySelector('div').classList.add('bg-transparent');
                    });

                    // Set active styles if checked
                    if (e.target.checked) {
                        const cardContainer = e.target.nextElementSibling;
                        cardContainer.classList.remove('border-transparent');
                        cardContainer.classList.add('border-primary');
                        
                        const indicator = cardContainer.querySelector('.rounded-full');
                        indicator.classList.remove('border-outline-variant');
                        indicator.classList.add('border-primary');
                        indicator.querySelector('div').classList.remove('bg-transparent');
                        indicator.querySelector('div').classList.add('bg-primary');
                    }
                });
            });
        });
    </script>
