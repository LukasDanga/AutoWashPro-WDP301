<body class="bg-background text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-container/30">

</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-4xl mx-auto px-container-padding py-6 pb-32">

<div class="flex items-center justify-between mb-section-margin max-w-md mx-auto relative px-4">

<!-- Active Line Progress -->

<!-- Step 1: Branch -->
<div class="relative z-10 flex flex-col items-center gap-2">

<!-- Step 2: Package -->
<div class="relative z-10 flex flex-col items-center gap-2">

<script>
        // Simple script to handle selection toggling for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.vehicle-card');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected state from all
                    cards.forEach(c => {
                        c.classList.remove('selected');
                        c.classList.remove('border-primary-container');
                        c.classList.add('border-transparent');
                        c.classList.add('shadow-[0px_4px_20px_rgba(0,0,0,0.05)]');
                        
                        // Reset icon fill
                        const icon = c.querySelector('.material-symbols-outlined[data-icon="directions_car"]');
                        if(icon) {
                            icon.style.fontVariationSettings = "'FILL' 0";
                            icon.classList.replace('text-on-surface', 'text-on-surface-variant');
                        }

                        // Reset indicator
                        const indicator = c.querySelector('.selection-indicator');
                        indicator.innerHTML = '';
                        indicator.className = 'selection-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 transition-colors';
                    });
                    
                    // Add selected state to clicked
                    card.classList.add('selected');
                    card.classList.remove('border-transparent');
                    card.classList.remove('shadow-[0px_4px_20px_rgba(0,0,0,0.05)]');
                    
                    // Set icon fill
                    const activeIcon = card.querySelector('.material-symbols-outlined[data-icon="directions_car"]');
                    if(activeIcon) {
                        activeIcon.style.fontVariationSettings = "'FILL' 1";
                        activeIcon.classList.replace('text-on-surface-variant', 'text-on-surface');
                    }

                    // Set indicator
                    const activeIndicator = card.querySelector('.selection-indicator');
                    activeIndicator.innerHTML = '<span class="material-symbols-outlined text-[16px]" data-icon="check" data-weight="bold">check</span>';
                    activeIndicator.className = 'selection-indicator w-6 h-6 rounded-full border-2 border-primary-container bg-primary-container text-white flex items-center justify-center shrink-0 transition-colors relative z-10';
                });
            });
        });
    </script>
