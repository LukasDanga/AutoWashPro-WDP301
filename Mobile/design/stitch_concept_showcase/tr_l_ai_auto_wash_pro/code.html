<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AutoWash AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f8f9fa",
                    "secondary-container": "#e2dfde",
                    "surface-variant": "#e1e3e4",
                    "on-surface-variant": "#3e4942",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#71dba6",
                    "tertiary": "#735c00",
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary-fixed-variant": "#005235",
                    "secondary-fixed-dim": "#c8c6c5",
                    "error-container": "#ffdad6",
                    "secondary": "#5f5e5e",
                    "surface-container-low": "#f3f4f5",
                    "surface-container-highest": "#e1e3e4",
                    "primary-container": "#00875a",
                    "outline-variant": "#bdcac0",
                    "inverse-surface": "#2e3132",
                    "on-secondary-container": "#636262",
                    "on-primary-fixed": "#002113",
                    "background": "#f8f9fa",
                    "tertiary-fixed-dim": "#e9c349",
                    "tertiary-container": "#cca730",
                    "on-surface": "#191c1d",
                    "on-tertiary-container": "#4f3d00",
                    "error": "#ba1a1a",
                    "surface-tint": "#006c47",
                    "surface-container": "#edeeef",
                    "surface-container-high": "#e7e8e9",
                    "on-tertiary-fixed": "#241a00",
                    "primary-fixed-dim": "#71dba6",
                    "primary": "#006b47",
                    "inverse-on-surface": "#f0f1f2",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#1c1b1b",
                    "surface-bright": "#f8f9fa",
                    "surface-dim": "#d9dadb",
                    "outline": "#6e7a71",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#e5e2e1",
                    "primary-fixed": "#8df7c1",
                    "on-primary-container": "#ffffff",
                    "tertiary-fixed": "#ffe088",
                    "on-tertiary-fixed-variant": "#574500",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "on-background": "#191c1d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "20px",
                    "base": "8px",
                    "section-margin": "32px",
                    "gutter": "16px",
                    "card-gap": "12px"
            },
            "fontFamily": {
                    "display-lg": ["Manrope"],
                    "headline-sm": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "body-md": ["Manrope"],
                    "label-md": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "caption": ["Manrope"],
                    "headline-md": ["Manrope"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-container-padding w-full h-16 bg-surface dark:bg-background text-primary dark:text-primary-fixed-dim font-headline-sm text-headline-sm docked full-width top-0 shadow-sm transition-colors duration-200 active:scale-95 z-40 relative">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">AutoWash AI</h1>
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high p-2 rounded-full transition-colors" data-icon="more_vert">more_vert</button>
</header>
<!-- Main Chat Area -->
<main class="flex-1 overflow-y-auto px-container-padding pt-6 pb-32 flex flex-col gap-6">
<!-- Assistant Message -->
<div class="flex items-start gap-3 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-container text-sm" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="bg-surface-container-low p-4 rounded-2xl rounded-tl-sm shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-surface-variant/50">
<p class="font-body-md text-on-surface">Xin chào! Tôi là trợ lý AI của AutoWash AI. Tôi có thể giúp bạn:</p>
<ul class="list-disc pl-5 mt-2 space-y-1 font-body-md text-on-surface">
<li>Tư vấn dịch vụ rửa xe</li>
<li>Kiểm tra khung giờ còn trống</li>
<li>Đặt lịch rửa xe ngay</li>
</ul>
<p class="font-body-md text-on-surface mt-3 font-medium">Bạn cần hỗ trợ gì hôm nay?</p>
</div>
</div>
<!-- Spacer to push suggestions to bottom if needed, but flex-col naturally handles it -->
<div class="flex-1"></div>
<!-- Quick Suggestions -->
<div class="flex flex-col gap-3 mt-8">
<h3 class="font-label-md text-secondary ml-1">Gợi ý nhanh</h3>
<div class="flex flex-wrap gap-2">
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="location_on">location_on</span>
<span class="font-label-md text-on-surface">Chi nhánh gần nhất</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="local_car_wash">local_car_wash</span>
<span class="font-label-md text-on-surface">Dịch vụ rửa xe</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md text-on-surface">Đặt lịch hôm nay</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="local_offer">local_offer</span>
<span class="font-label-md text-on-surface">Voucher giảm giá</span>
</button>
</div>
</div>
</main>
<!-- Input Area (Fixed above Bottom Nav) -->
<div class="fixed bottom-[80px] w-full px-container-padding py-3 bg-gradient-to-t from-surface to-surface/80 backdrop-blur-sm z-40">
<div class="flex items-center gap-3 bg-surface-container-lowest border border-outline-variant rounded-full p-2 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-secondary hover:bg-surface-container transition-colors shrink-0">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-secondary p-0" placeholder="Nhắn tin cho AutoWash AI..." type="text"/>
<button class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center hover:bg-primary transition-colors shrink-0 shadow-sm mr-1">
<span class="material-symbols-outlined text-[20px]" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<!-- Suppressed active state highlighting generic tabs as instructed by Semantic Shell Mandate (Active State Logic: Anti-Hallucination) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-white/80 backdrop-blur-md rounded-t-xl shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] md:hidden">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-surface-container dark:hover:bg-on-surface-variant/10 transition-transform duration-200 active:scale-90 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-caption text-caption">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-surface-container dark:hover:bg-on-surface-variant/10 transition-transform duration-200 active:scale-90 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-caption text-caption">Bookings</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-surface-container dark:hover:bg-on-surface-variant/10 transition-transform duration-200 active:scale-90 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-caption text-caption">Check-in</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim p-2 hover:bg-surface-container dark:hover:bg-on-surface-variant/10 transition-transform duration-200 active:scale-90 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-caption text-caption">Account</span>
</a>
</nav>
</body></html>
