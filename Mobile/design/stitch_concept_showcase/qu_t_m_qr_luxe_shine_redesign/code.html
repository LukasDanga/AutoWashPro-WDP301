<body class="bg-surface text-on-surface antialiased pb-24 h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background docked full-width top-0 flex justify-between items-center px-container-padding py-base w-full max-w-7xl mx-auto z-40 sticky">
<button class="p-2 -ml-2 text-primary dark:text-primary-fixed hover:bg-surface-container-low transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Auto Wash Pro</h1>
<button class="p-2 -mr-2 text-primary dark:text-primary-fixed hover:bg-surface-container-low transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-padding py-base w-full max-w-md mx-auto">
<!-- Segmented Control -->
<div class="bg-surface-container-low p-1 rounded-full flex mb-section-margin shadow-sm">
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-secondary transition-colors">Xem QR</button>
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container shadow-sm transition-colors">Quét QR</button>
<button class="flex-1 py-2 text-center rounded-full font-label-md text-label-md text-secondary transition-colors">Nhập mã</button>
</div>
<!-- Scanner Area -->
<div class="relative w-full aspect-square bg-surface-container-highest rounded-xl mb-section-margin overflow-hidden flex flex-col items-center justify-center shadow-inner border border-surface-variant">
<!-- Corner Accents (Simulated Scanner Frame) -->
<div class="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Permission Required State -->
<div class="flex flex-col items-center justify-center text-center p-6 z-10">
<span class="material-symbols-outlined text-4xl text-error mb-4" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Không có quyền camera</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Vui lòng cấp quyền camera trong Cài đặt thiết bị để sử dụng tính năng quét mã.</p>
<button class="mt-6 px-6 py-2 bg-surface border border-outline text-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-surface-container-low transition-colors">
                    Mở Cài đặt
                </button>
</div>
<!-- Hidden Background Image for context if needed, currently obscured by the permission state -->
<div class="absolute inset-0 opacity-10 blur-sm mix-blend-overlay pointer-events-none" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB9qOJwyNgw3FYd74p-LIvkihPhNrwGwlcr_wChMGkxS_lLL-hW-uPQmZpWzqqUkT957Ub28pCM2H2mz5VVkLtQw8AAWpenoXGCwY4_KHvp35SMD9yMc8YwWOhU7w7ya9uz0giP5-7AfhZANXRxGZ4PEJCIVRKx6mnEea_0nZI9ukCgbRXyLVPi1oAsvbfeVyOuEdBzbIveDf8ZVY6td_3onS4HYWVzniN97ceVmTmGJpTkFdjNVi4fb3S0kH4BFHbmjHQ'); background-size: cover; background-position: center;"></div>

<div class="h-px bg-surface-variant flex-grow"></div>
<span class="px-4 font-caption text-caption text-secondary uppercase tracking-wider">Hoặc</span>
<div class="h-px bg-surface-variant flex-grow"></div>
</div>
<!-- Manual Entry Area -->
<div class="flex flex-col gap-4">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-2" for="bookingId">Nhập mã booking (ObjectId 24 ký tự)</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="bookingId" placeholder="VD: 5f9b3b3b3b3b3b3b3b3b3b3b" type="text">
</div>
