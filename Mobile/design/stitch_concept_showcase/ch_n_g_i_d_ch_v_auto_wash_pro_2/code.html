<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mua gói slot - Auto Wash Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container-highest": "#e1e3e4",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "on-primary-container": "#ffffff",
                        "on-tertiary-container": "#4f3d00",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#f8f9fa",
                        "tertiary-fixed": "#ffe088",
                        "outline": "#6e7a71",
                        "on-primary-fixed-variant": "#005235",
                        "on-primary-fixed": "#002113",
                        "tertiary-container": "#cca730",
                        "on-background": "#191c1d",
                        "surface": "#f8f9fa",
                        "inverse-primary": "#71dba6",
                        "tertiary-fixed-dim": "#e9c349",
                        "surface-tint": "#006c47",
                        "primary-fixed": "#8df7c1",
                        "on-surface-variant": "#3e4942",
                        "surface-container-low": "#f3f4f5",
                        "secondary-container": "#e2dfde",
                        "secondary": "#5f5e5e",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "outline-variant": "#bdcac0",
                        "on-tertiary-fixed": "#241a00",
                        "surface-bright": "#f8f9fa",
                        "on-secondary-container": "#636262",
                        "secondary-fixed": "#e5e2e1",
                        "surface-variant": "#e1e3e4",
                        "on-error-container": "#93000a",
                        "primary": "#006b47",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f1f2",
                        "primary-container": "#00875a",
                        "on-surface": "#191c1d",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474746",
                        "on-tertiary-fixed-variant": "#574500",
                        "tertiary": "#735c00",
                        "primary-fixed-dim": "#71dba6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "section-margin": "32px",
                        "gutter": "16px",
                        "card-gap": "12px",
                        "base": "8px",
                        "container-padding": "20px"
                    },
                    fontFamily: {
                        "headline-lg": ["Manrope"],
                        "label-md": ["Manrope"],
                        "caption": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-sm": ["Manrope"],
                        "display-lg": ["Manrope"]
                    },
                    fontSize: {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[100px] md:pb-0">
<!-- Header (Suppressed top app bar as this is a linear flow step, but we show a title area) -->
<header class="w-full flex justify-center items-center py-6 sticky top-0 bg-background z-40">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Mua gói slot</h1>
</header>
<main class="max-w-3xl mx-auto px-container-padding flex flex-col gap-section-margin">
<!-- Progress Indicator -->
<section class="flex items-center justify-center gap-2 mb-4">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary-container text-on-primary-container">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<div class="h-0.5 w-8 bg-primary-container"></div>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md">
                2
            </div>
<div class="h-0.5 w-8 bg-surface-container-high"></div>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container-low text-on-surface-variant font-label-md text-label-md">
                3
            </div>
<div class="h-0.5 w-8 bg-surface-container-high"></div>
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container-low text-on-surface-variant font-label-md text-label-md">
                4
            </div>
</section>
<!-- Chọn xe -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Chọn xe</h2>
<div class="flex flex-col gap-card-gap">
<!-- Option 1: All cars -->
<button class="w-full text-left p-4 rounded-xl border border-surface-container-highest bg-surface-container-lowest hover:bg-surface-container-low transition-colors flex items-center gap-4">
<span class="text-2xl">🚗</span>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-semibold">Tất cả xe</span>
<span class="font-caption text-caption text-on-surface-variant">Không khóa cứng 1 biển số</span>
</div>
</button>
<!-- Option 2: Active Car -->
<button class="w-full text-left p-4 rounded-xl border-2 border-primary bg-primary-fixed/10 transition-colors flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-semibold">LEXUS LX600</span>
<span class="font-caption text-caption text-on-surface-variant">47A-56789</span>
</div>
</button>
<!-- Option 3: Other Car -->
<button class="w-full text-left p-4 rounded-xl border border-surface-container-highest bg-surface-container-lowest hover:bg-surface-container-low transition-colors flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-semibold">BMW 735i Pure Excellence</span>
<span class="font-caption text-caption text-on-surface-variant">47A-99999</span>
</div>
</button>
</div>
</section>
<!-- Chọn gói dịch vụ -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Chọn gói dịch vụ</h2>
<div class="flex flex-col gap-card-gap">
<!-- Service 1: Active -->
<button class="w-full text-left p-4 rounded-xl border-2 border-primary bg-primary-fixed/10 transition-colors flex flex-col gap-1">
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface font-semibold">Rửa xe máy</span>
<span class="font-label-md text-label-md text-primary font-bold">50.000 ₫</span>
</div>
<p class="font-caption text-caption text-on-surface-variant">Rửa xe máy sạch bóng, lau khô và kiểm tra sên xe.</p>
</button>
<!-- Service 2 -->
<button class="w-full text-left p-4 rounded-xl border border-surface-container-highest bg-surface-container-lowest hover:bg-surface-container-low transition-colors flex flex-col gap-1">
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface font-semibold">Rửa xe cơ bản</span>
<span class="font-label-md text-label-md text-primary font-bold">100.000 ₫</span>
</div>
<p class="font-caption text-caption text-on-surface-variant">Rửa ngoại thất toàn bộ, lau khô và vệ sinh bánh xe.</p>
</button>
<!-- Service 3 -->
<button class="w-full text-left p-4 rounded-xl border border-surface-container-highest bg-surface-container-lowest hover:bg-surface-container-low transition-colors flex flex-col gap-1">
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface font-semibold">Rửa xe + Phủ Nano</span>
<span class="font-label-md text-label-md text-primary font-bold">250.000 ₫</span>
</div>
<p class="font-caption text-caption text-on-surface-variant">Rửa ngoại thất chuyên sâu và phủ bảo vệ nano, bảo vệ sơn 3 tháng.</p>
</button>
<!-- Service 4 -->
<button class="w-full text-left p-4 rounded-xl border border-surface-container-highest bg-surface-container-lowest hover:bg-surface-container-low transition-colors flex flex-col gap-1">
<div class="flex justify-between items-start">
<span class="font-body-md text-body-md text-on-surface font-semibold">Vệ sinh toàn diện</span>
<span class="font-label-md text-label-md text-primary font-bold">380.000 ₫</span>
</div>
<p class="font-caption text-caption text-on-surface-variant">Chăm sóc xe toàn bộ: ngoại thất, nội thất và khoang máy.</p>
</button>
</div>
</section>
<!-- Bottom Actions (Fixed for flow) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] flex justify-between gap-4 z-50 md:relative md:bg-transparent md:shadow-none md:p-0 md:mt-8 md:mb-12">
<button class="flex-1 py-3 px-6 rounded-lg border-2 border-primary bg-surface-container-lowest text-primary font-label-md text-label-md hover:bg-primary-fixed/10 transition-colors text-center">
                Quay lại
            </button>
<button class="flex-1 py-3 px-6 rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md hover:opacity-90 transition-opacity text-center shadow-[0px_4px_12px_rgba(0,135,90,0.2)]">
                Tiếp theo
            </button>
</div>
</main>
</body></html>
