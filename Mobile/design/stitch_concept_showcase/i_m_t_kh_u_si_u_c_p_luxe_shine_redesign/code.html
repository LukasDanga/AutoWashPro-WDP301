<!DOCTYPE html><html lang="vi"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Wash Pro - Đổi mật khẩu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-fixed": "#241a00",
                        "outline-variant": "#bdcac0",
                        "on-secondary-fixed-variant": "#474746",
                        "on-background": "#191c1d",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "surface-tint": "#006c47",
                        "primary": "#006b47",
                        "on-surface-variant": "#3e4942",
                        "on-primary-fixed-variant": "#005235",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#ffe088",
                        "surface": "#f8f9fa",
                        "surface-variant": "#e1e3e4",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d9dadb",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-tertiary-container": "#4f3d00",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed": "#1c1b1b",
                        "tertiary-container": "#cca730",
                        "on-primary-fixed": "#002113",
                        "on-error": "#ffffff",
                        "inverse-primary": "#71dba6",
                        "surface-container": "#edeeef",
                        "on-secondary": "#ffffff",
                        "outline": "#6e7a71",
                        "surface-bright": "#f8f9fa",
                        "secondary": "#5f5e5e",
                        "background": "#f8f9fa",
                        "primary-container": "#00875a",
                        "on-primary-container": "#ffffff",
                        "tertiary-fixed-dim": "#e9c349",
                        "secondary-container": "#e2dfde",
                        "tertiary": "#735c00",
                        "on-surface": "#191c1d",
                        "on-secondary-container": "#636262",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-low": "#f3f4f5",
                        "primary-fixed-dim": "#71dba6",
                        "primary-fixed": "#8df7c1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-gap": "12px",
                        "base": "8px",
                        "container-padding": "20px",
                        "section-margin": "32px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Manrope"],
                        "headline-sm": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "caption": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "display-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-24">

    <!-- TopAppBar -->
    <header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim flex items-center justify-between px-container-padding h-16">
        <button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-200 transition-transform">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back_ios_new</span>
        </button>
        <h1 class="font-headline-md text-headline-md text-on-surface">Đổi mật khẩu</h1>
        <div class="w-6"></div> <!-- Spacer for balance -->
    </header>

    <!-- Main Content -->
    <main class="flex-grow px-container-padding flex flex-col items-center">
        
        <!-- Icon Anchor -->
        <div class="mt-8 mb-6 bg-[#e6f4ef] rounded-full w-24 h-24 flex items-center justify-center shadow-[0px_4px_20px_rgba(0,135,90,0.05)]">
            <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 0;">lock</span>
        </div>

        <p class="font-body-md text-body-md text-secondary text-center mb-8 px-4">
            Để bảo mật tài khoản, vui lòng sử dụng mật khẩu mạnh với ít nhất 6 ký tự
        </p>

        <!-- Form Card -->
        <div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex flex-col gap-6">
            
            <!-- Current Password -->
            <div class="flex flex-col gap-2">
                <label class="font-label-md text-label-md text-on-surface-variant">Mật khẩu hiện tại</label>
                <div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <span class="material-symbols-outlined absolute left-3 text-secondary" style="font-variation-settings: 'FILL' 0;">key</span>
                    <input type="password" placeholder="Nhập mật khẩu hiện tại" class="w-full bg-transparent border-none py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:ring-0 rounded-lg outline-none">
                    <button type="button" class="absolute right-3 text-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- New Password -->
            <div class="flex flex-col gap-2">
                <label class="font-label-md text-label-md text-on-surface-variant">Mật khẩu mới</label>
                <div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <span class="material-symbols-outlined absolute left-3 text-secondary" style="font-variation-settings: 'FILL' 0;">lock_reset</span>
                    <input type="password" placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)" class="w-full bg-transparent border-none py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:ring-0 rounded-lg outline-none">
                    <button type="button" class="absolute right-3 text-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div class="flex flex-col gap-2">
                <label class="font-label-md text-label-md text-on-surface-variant">Xác nhận mật khẩu mới</label>
                <div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <span class="material-symbols-outlined absolute left-3 text-secondary" style="font-variation-settings: 'FILL' 0;">lock_clock</span>
                    <input type="password" placeholder="Nhập lại mật khẩu mới" class="w-full bg-transparent border-none py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:ring-0 rounded-lg outline-none">
                    <button type="button" class="absolute right-3 text-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Actions -->
        <div class="w-full max-w-md mt-section-margin flex flex-col gap-4">
            <button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-lg shadow-[0px_10px_30px_rgba(0,135,90,0.15)] hover:opacity-90 active:scale-95 transition-all">
                Đổi mật khẩu
            </button>

</div></main><nav class="fixed bottom-0 left-0 right-0 bg-surface-container-lowest border-t border-outline-variant px-container-padding py-3 flex justify-between items-center z-50">
  <button class="flex flex-col items-center gap-1 text-secondary hover:text-primary transition-colors">
    <span class="material-symbols-outlined">home</span>
    <span class="text-caption font-caption">Trang chủ</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-secondary hover:text-primary transition-colors">
    <span class="material-symbols-outlined">calendar_month</span>
    <span class="text-caption font-caption">Lịch hẹn</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-secondary hover:text-primary transition-colors">
    <span class="material-symbols-outlined">qr_code_scanner</span>
    <span class="text-caption font-caption">Check-in</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-primary transition-colors">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
    <span class="text-caption font-caption">Tài khoản</span>
  </button>
</nav></body></html>
