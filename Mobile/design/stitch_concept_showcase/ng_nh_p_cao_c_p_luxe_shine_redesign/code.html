<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Premium Car Wash</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            emerald: {
              main: '#00875a',
            },
            surface: {
              DEFAULT: '#f8f9fa',
              container: '#ebecec',
            },
            text: {
              main: '#191c1b',
              muted: '#404945',
            }
          },
          borderRadius: {
            'xl': '0.75rem',
            '3xl': '1.5rem',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">body {
    font-family: "Manrope", sans-serif;
    background-color: #f8f9fa
    }
/* Background setup simulating the blurred car image from SCREEN_4 */
.bg-blurred-image {
    background-image: linear-gradient(to bottom, rgba(0, 135, 90, 0.6) 0%, rgba(248, 249, 250, 1) 40%), url(https://lh3.googleusercontent.com/aida-public/AB6AXuCo9I6VpXTO_yeyxPDN-D9zL7F_8BTIo4aUWqZZwCCgeOGLoPwjDmtxOF9L0n1YgP-fd3Iytxf29Q-Aiu2ViNPLBHoKI5qDm5LLd8aZcIOg2u-wJzJtll0S5upx2tAf6ag5ALlyO9hXkSMz4rapvtwzk1QFnEJe1PPnfsEGgULDwKZigQZc7mEw82K55SiaFeJYBJ8hPOrcmSCBIAJy8leiSGtegLOiiJu3C_icxzzRRStzU3p4_0vFEw);
    background-size: cover;
    background-position: top center;
    background-attachment: fixed
    }</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"></head>
<body class="bg-blurred-image min-h-screen flex flex-col items-center justify-end relative font-sans text-text-main antialiased selection:bg-emerald-main selection:text-white">
<!-- BEGIN: Main Header Area -->
<header class="absolute top-0 left-0 w-full px-6 pt-12 pb-4 flex justify-between items-center z-10 text-white">
<button aria-label="Go back" class="flex items-center gap-1 text-sm font-semibold hover:opacity-80 transition-opacity">
<svg class="lucide lucide-chevron-left" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6"></path></svg>
      Back
    </button>
<a class="text-sm font-bold tracking-wide hover:opacity-80 transition-opacity" href="#">Auto Wash Pro</a>
</header>
<!-- END: Main Header Area -->
<!-- BEGIN: Login Card Container -->
<main class="bg-surface w-full max-w-md rounded-t-[2.5rem] px-6 pt-12 pb-10 flex flex-col items-center shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative mt-[20vh]">
<!-- Top Logo / Icon -->
<div class="bg-emerald-main/10 text-emerald-main w-16 h-16 rounded-full flex items-center justify-center mb-6">
<svg class="lucide lucide-car" fill="none" height="32" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="32" xmlns="http://www.w3.org/2000/svg"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
</div>
<!-- Title and Subtitle -->
<div class="text-center mb-10 w-full">
<h1 class="text-[28px] font-bold text-text-main mb-2 tracking-tight">Welcome Back</h1>
<p class="text-text-muted text-[15px] leading-relaxed max-w-[280px] mx-auto">
        Sign in to access your account and services
      </p>
</div>
<!-- BEGIN: Login Form -->
<form class="w-full flex flex-col gap-4">
<!-- Email Input -->
<div class="relative bg-surface-container rounded-[1.25rem] px-5 py-3 flex items-center gap-4 transition-colors focus-within:ring-2 focus-within:ring-emerald-main/20">
<svg class="text-gray-400 shrink-0" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><rect height="16" rx="2" width="20" x="2" y="4"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
<div class="flex-1">
<label class="block text-xs font-semibold text-emerald-main mb-0.5" for="email">Email</label>
<input class="w-full bg-transparent border-none p-0 text-[15px] font-medium text-text-main placeholder-gray-400 focus:ring-0" id="email" name="email" placeholder="Enter your email" type="email" value="alex.jason@email.com">
</div>
</div>
<!-- Password Input -->
<div class="relative bg-surface-container rounded-[1.25rem] px-5 py-3 flex items-center gap-4 transition-colors focus-within:ring-2 focus-within:ring-emerald-main/20">
<svg class="text-gray-400 shrink-0" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<div class="flex-1">
<label class="block text-xs font-semibold text-emerald-main mb-0.5" for="password">Password</label>
<input class="w-full bg-transparent border-none p-0 text-[15px] font-medium text-text-main placeholder-gray-400 focus:ring-0" id="password" name="password" placeholder="Enter your password" type="password" value="........">
</div>
<button class="text-xs font-medium text-gray-500 hover:text-text-main flex items-center gap-1 transition-colors" type="button">
          Show
          <svg class="lucide lucide-eye" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-center mt-2 mb-2">
<a class="text-sm font-semibold text-text-muted hover:text-emerald-main transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-emerald-main text-white py-4 rounded-[1.25rem] font-bold text-[16px] shadow-sm hover:bg-emerald-main/90 transition-all active:scale-[0.98] mt-2" type="submit">
        Login
      </button>
</form>
<!-- END: Login Form -->
<!-- BEGIN: Social Login Area -->
<div class="w-full mt-10 flex items-center gap-4">
<div class="h-px bg-gray-200 flex-1"></div>
<span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Or sign in with</span>
<div class="h-px bg-gray-200 flex-1"></div>
</div>
<div class="flex gap-4 mt-6">
<button aria-label="Sign in with Apple" class="w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center hover:bg-gray-50 transition-colors shadow-sm" type="button">
<svg class="fill-black" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M16.365 7.172c-.894 1.074-2.185 1.76-3.483 1.666-.192-1.257.42-2.585 1.257-3.623.856-1.05 2.213-1.745 3.42-1.664.195 1.294-.37 2.607-1.194 3.621Zm-3.141 12.08c-1.393-.05-2.673-.91-4.015-.91-1.385 0-2.88.948-4.101.948-3.082 0-6.19-3.708-6.19-8.484 0-3.328 1.83-5.594 4.194-5.594 1.571 0 2.82.911 4.136.911 1.206 0 2.923-1.042 4.606-1.042 1.94 0 3.513.78 4.545 2.274-3.714 2.18-3.14 7.625.64 9.112-1.026 1.79-2.302 3.011-3.815 2.785Z"></path></svg>
</button>
<button aria-label="Sign in with Google" class="w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center hover:bg-gray-50 transition-colors shadow-sm" type="button">
<svg height="22" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</button>
</div>
<!-- END: Social Login Area -->
<!-- Footer Link -->
<p class="mt-8 text-sm text-text-muted">
      Don't have an account? 
      <a class="font-bold text-emerald-main hover:underline decoration-2 underline-offset-4" href="#">Sign Up</a>
</p>
<!-- Bottom Safe Area Indicator (iOS) -->
<nav class="w-full mt-8 border-t border-gray-200 pt-4 flex justify-around items-center">
  <a href="#" class="flex flex-col items-center gap-1 text-text-muted hover:text-emerald-main transition-colors">
    <span class="material-symbols-outlined">home</span>
    <span class="text-xs font-medium">Home</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-text-muted hover:text-emerald-main transition-colors">
    <span class="material-symbols-outlined">calendar_month</span>
    <span class="text-xs font-medium">Bookings</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-text-muted hover:text-emerald-main transition-colors">
    <span class="material-symbols-outlined">qr_code_scanner</span>
    <span class="text-xs font-medium">Check-in</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-emerald-main">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">person</span>
    <span class="text-xs font-bold">Account</span>
  </a>
</nav><div class="w-32 h-1 bg-gray-300 rounded-full mt-8 mb-2"></div>
</main>
<!-- END: Login Card Container -->


</body></html>
