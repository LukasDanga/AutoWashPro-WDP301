<!DOCTYPE html><html lang="en" style=""><head><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Account - Auto Wash Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            emerald: {
              DEFAULT: '#00875a',
              hover: '#006a46',
            },
            surface: {
              DEFAULT: '#f8f9fa',
              dim: '#d9dadb',
              bright: '#ffffff',
              container: '#f3f4f5',
            }
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem',
            '3xl': '2rem',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styles">body {
    background-color: #f8f9fa;
    font-family: "Manrope", sans-serif
    }
/* Background Image Area */
.hero-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBrWFzbV96Ff7yhDne4QkEBDMntBrag1y6EIxBF--1NdBFw7FGxhz2ezqhKYc4AiUTdUGf1NitXjhw0lWzW_MjWiae7n5BlkxCPSdjNa0mNXMe9IYDJeWl_n8qRqQxyR0sya1hDSkVHuDnJ874TBVUjKHEWw31xDhJ-IFj62EyfsQNXZcE2ooJ9d_C46V7xotOaRtHC1mYs_5vGld_KMGB4avMWV_anY3rCv6i4AV6HWhI0LHRbSAhIMg);
    background-size: cover;
    background-position: center;
    position: relative
    }
.hero-overlay {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(248, 249, 250, 1) 100%);
    position: absolute;
    inset: 0
    }
/* Content Card */
.content-card {
    border-top-left-radius: 2rem;
    border-top-right-radius: 2rem;
    background-color: #f8f9fa;
    margin-top: -3rem;
    position: relative;
    z-index: 10
    }
/* Custom Input Styling */
.input-container {
    background-color: #f3f4f5;
    border-radius: 1rem;
    border: 1px solid transparent;
    transition: all 0.3s ease
    }
.input-container:focus-within {
    border-color: #00875a;
    background-color: #fff;
    box-shadow: 0 4px 6px -1px rgba(0, 135, 90, 0.1), 0 2px 4px -1px rgba(0, 135, 90, 0.06)
    }
.input-field {
    background: transparent;
    border: none;
    outline: none
    }
.input-field:focus {
    outline: none;
    box-shadow: none
    }</style>
</head>
<body class="antialiased min-h-screen flex flex-col">
<!-- BEGIN: Hero Header Area -->
<header class="hero-bg h-64 w-full relative" data-purpose="hero-background">
<div class="hero-overlay"></div>
<!-- Top Navigation -->
<nav class="relative z-10 flex justify-between items-center px-6 pt-12 pb-4">
<a class="text-white font-medium flex items-center gap-2 hover:text-emerald transition-colors" href="#">
<i class="fa-solid fa-chevron-left"></i>
<span class="">Back</span>
</a>
<a class="text-emerald font-semibold hover:text-emerald-hover transition-colors" href="#">Log in</a>
</nav>
</header>
<!-- END: Hero Header Area -->
<!-- BEGIN: Main Content Area -->
<main class="content-card flex-1 px-6 pb-10 flex flex-col" data-purpose="main-content">
<!-- Logo & Header -->
<div class="flex flex-col items-center pt-8 mb-8">
<div class="w-14 h-14 bg-emerald/10 rounded-full flex items-center justify-center mb-6 text-emerald text-2xl">
<i class="fa-solid fa-car-sparkles"></i>
</div>
<h1 class="text-3xl font-bold text-gray-900 mb-2">Create Account</h1>
<p class="text-gray-500 text-center text-sm px-4 leading-relaxed">Join Auto Wash Pro today for sparkling results.</p>
</div>
<!-- Registration Form -->
<form class="space-y-4 mb-6" data-purpose="registration-form">
<!-- Name Input -->
<div class="input-container p-3 flex items-center gap-4">
<div class="text-gray-400 pl-2">
<i class="fa-regular fa-user text-lg"></i>
</div>
<div class="flex-1 flex flex-col justify-center">
<label class="text-xs font-semibold text-emerald mb-0.5" for="name">Name</label>
<input class="input-field w-full text-sm font-medium text-gray-900 p-0 placeholder-gray-400" id="name" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Email Input -->
<div class="input-container p-3 flex items-center gap-4">
<div class="text-gray-400 pl-2">
<i class="fa-regular fa-envelope text-lg"></i>
</div>
<div class="flex-1 flex flex-col justify-center">
<label class="text-xs font-semibold text-emerald mb-0.5" for="email">Email</label>
<input class="input-field w-full text-sm font-medium text-gray-900 p-0 placeholder-gray-400" id="email" placeholder="jane@example.com" type="email">
</div>
</div>
<!-- Password Input -->
<!-- Phone Number Input -->
<div class="input-container p-3 flex items-center gap-4">
<div class="text-gray-400 pl-2">
<i class="fa-solid fa-phone text-lg"></i>
</div>
<div class="flex-1 flex flex-col justify-center">
<label class="text-xs font-semibold text-emerald mb-0.5" for="phone">Phone Number</label>
<input class="input-field w-full text-sm font-medium text-gray-900 p-0 placeholder-gray-400" id="phone" placeholder="(555) 123-4567" type="tel">
</div>
</div><div class="input-container p-3 flex items-center gap-4">
<div class="text-gray-400 pl-2">
<i class="fa-solid fa-lock text-lg"></i>
</div>
<div class="flex-1 flex flex-col justify-center">
<label class="text-xs font-semibold text-emerald mb-0.5" for="password">Password</label>
<input class="input-field w-full text-sm font-medium text-gray-900 p-0 placeholder-gray-400" id="password" placeholder="At least 6 characters" type="password">
</div>
<button class="text-xs font-medium text-gray-500 flex items-center gap-1.5 pr-2 hover:text-emerald transition-colors" type="button">
<span class="">Show</span>
<i class="fa-regular fa-eye"></i>
</button>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 pt-2 pb-4">
<div class="flex items-center h-5 mt-0.5">
<input class="w-5 h-5 rounded border-gray-300 text-emerald focus:ring-emerald cursor-pointer" id="terms" type="checkbox">
</div>
<label class="text-sm text-gray-600 leading-snug cursor-pointer" for="terms">
          By signing up, I agree to the <a class="text-emerald font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-emerald font-semibold hover:underline" href="#">Privacy Policy</a>.
        </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-emerald hover:bg-emerald-hover text-white font-semibold py-4 rounded-xl shadow-lg shadow-emerald/20 transition-all active:scale-[0.98]" type="submit">
        Sign Up
      </button>
</form>
<!-- Social Login Section -->
<div class="mt-auto pt-6" data-purpose="social-login">
<div class="relative flex py-4 items-center mb-4">
<div class="flex-grow border-t border-gray-200"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-gray-400">Or sign up with:</span>
<div class="flex-grow border-t border-gray-200"></div>
</div>
<div class="flex justify-center gap-6 mb-8">
<button class="w-14 h-14 rounded-full bg-white border border-gray-100 shadow-sm flex items-center justify-center text-xl hover:bg-gray-50 transition-colors">
<i class="fa-brands fa-apple text-gray-900"></i>
</button>
<button class="w-14 h-14 rounded-full bg-white border border-gray-100 shadow-sm flex items-center justify-center text-xl hover:bg-gray-50 transition-colors">
<i class="fa-brands fa-google text-[#DB4437]"></i>
</button>
</div>
<p class="text-center text-sm font-medium text-gray-500">
        Already have an account? <a class="text-emerald font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</main>
<!-- END: Main Content Area -->
<!-- Home Indicator Area (Simulated for Mobile UI) -->
<nav class="w-full bg-white border-t border-gray-200 pb-6 pt-3 flex justify-around items-center sticky bottom-0 z-20">
  <a href="#" class="flex flex-col items-center gap-1 text-emerald">
    <span class="material-symbols-outlined text-2xl">home</span>
    <span class="text-xs font-semibold">Home</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-gray-400 hover:text-emerald transition-colors">
    <span class="material-symbols-outlined text-2xl">calendar_month</span>
    <span class="text-xs font-medium">Bookings</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-gray-400 hover:text-emerald transition-colors">
    <span class="material-symbols-outlined text-2xl">qr_code_scanner</span>
    <span class="text-xs font-medium">Check-in</span>
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-gray-400 hover:text-emerald transition-colors">
    <span class="material-symbols-outlined text-2xl">person</span>
    <span class="text-xs font-medium">Account</span>
  </a>
</nav>




</body></html>
