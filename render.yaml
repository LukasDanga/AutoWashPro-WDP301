services:
  - type: web
    name: autowash-be
    env: node
    region: singapore
    plan: free
    rootDir: BE
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # L-3: thêm APP_URL + API_URL để CORS whitelist biết chính xác domain nào hợp lệ.
      # Trước đây chỉ có FE_URL → trusted origin list rỗng → CORS fallback về
      # '*.vercel.app' wildcard → quá permissive.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: FE_URL
        sync: false
      - key: VNPAY_TMNCODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # C-4: cho phép ops điều chỉnh grace period mà không cần redeploy code.
      - key: AUTO_CANCEL_GRACE_MINUTES
        value: "15"
